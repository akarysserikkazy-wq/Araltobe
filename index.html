<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аралтөбе – Алакөлдің туристік картасы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Аралтөбе – Алакөлдің туристік картасы</h1>
  <p>Нөмірлерді басыңыз · саусақпен жылжытып, жақындатып көріңіз</p>
</header>

<div id="wrap">
  <svg id="map" viewBox="0 0 800 500">
    <defs>
      <radialGradient id="deep" cx="50%" cy="50%" r="75%">
        <stop offset="0" stop-color="#2fa6d8"/><stop offset="1" stop-color="#0f6fa3"/>
      </radialGradient>
      <radialGradient id="land" cx="50%" cy="45%" r="65%">
        <stop offset="0" stop-color="#8fbf5e"/><stop offset=".6" stop-color="#6aa94a"/><stop offset="1" stop-color="#4a8f3f"/>
      </radialGradient>
      <radialGradient id="lakeg" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="#1d7fc0"/><stop offset=".8" stop-color="#3aa6dc"/><stop offset="1" stop-color="#6fd3e6"/>
      </radialGradient>
      <radialGradient id="shadeD">
        <stop offset="0" stop-color="#2f6e2c" stop-opacity=".4"/><stop offset="1" stop-color="#2f6e2c" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shadeL">
        <stop offset="0" stop-color="#c4e594" stop-opacity=".45"/><stop offset="1" stop-color="#c4e594" stop-opacity="0"/>
      </radialGradient>
      <pattern id="waves" width="46" height="26" patternUnits="userSpaceOnUse">
        <path d="M0 13q11.5-8 23 0t23 0" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
      </pattern>
      <clipPath id="gc"><polygon id="gclip"/></clipPath>
    </defs>

    <g id="view">
      <rect x="-3000" y="-3000" width="6800" height="6500" fill="url(#deep)"/>
      <rect x="-3000" y="-3000" width="6800" height="6500" fill="url(#waves)"/>

      <!-- шағын арал -->
      <g transform="translate(700,40)">
        <polygon points="2,30 16,8 40,2 62,14 68,38 46,56 20,52" fill="#8fdcf0" opacity=".55"/>
        <polygon points="10,30 20,14 40,10 55,18 57,34 42,44 24,43" fill="#e0d29c"/>
        <polygon points="16,30 24,19 40,16 50,22 51,33 40,39 26,38" fill="#4a9a40"/>
      </g>

      <!-- таяз су -->
      <g id="shallow"></g>

      <!-- құм + шөп -->
      <polygon id="sand" fill="#e3d398" stroke="#efe3b4" stroke-width="3" stroke-linejoin="round"/>
      <polygon id="grass" fill="url(#land)"/>
      <g clip-path="url(#gc)">
        <ellipse cx="360" cy="150" rx="75" ry="45" fill="url(#shadeD)"/>
        <ellipse cx="560" cy="190" rx="70" ry="55" fill="url(#shadeD)"/>
        <ellipse cx="400" cy="350" rx="95" ry="30" fill="url(#shadeD)"/>
        <ellipse cx="300" cy="260" rx="45" ry="65" fill="url(#shadeL)"/>
        <ellipse cx="570" cy="305" rx="65" ry="38" fill="url(#shadeL)"/>
        <ellipse cx="450" cy="110" rx="80" ry="35" fill="url(#shadeL)"/>
      </g>

      <!-- ішкі көл -->
      <polygon id="lakeSand" fill="#e3d398" stroke="#e3d398" stroke-width="2" stroke-linejoin="miter"/>
      <polygon id="lake" fill="url(#lakeg)" stroke="#6fd3e6" stroke-width="1.5" stroke-linejoin="miter"/>
      <polygon id="lakeIn" fill="#1d7fc0" opacity=".35"/>

      <g id="trees"></g>

      <text x="152" y="84" font-size="19" font-style="italic" fill="#fff" fill-opacity=".9" font-weight="600">Алакөл көлі</text>
      <text x="492" y="205" class="lbl" style="font-size:17px;font-weight:700">Аралтөбе аралы</text>

      <path id="r1" class="route"/>
      <path id="r2" class="route2"/>

      <!-- айлақ -->
      <rect x="378" y="384" width="9" height="26" fill="#8a6a3b" rx="2"/>

      <!-- КЕМЕ -->
      <g transform="translate(318,436) rotate(-22)">
        <path d="M-78,-14 L-36,-6 L-36,6 L-78,14 Z" fill="#fff" opacity=".35"/>
        <path d="M-60,-8 L-34,-4 L-34,4 L-60,8 Z" fill="#fff" opacity=".4"/>
        <path d="M-30,-9 L26,-9 Q46,-8 54,0 Q46,8 26,9 L-30,9 Z" fill="#0b2a3f" opacity=".3" transform="translate(3,4)"/>
        <path d="M-34,-11 L24,-11 Q46,-10 54,0 Q46,10 24,11 L-34,11 Z" fill="#f4f6f8" stroke="#8fa3b5" stroke-width="1"/>
        <path d="M-30,-8 L22,-8 Q40,-7 47,0 Q40,7 22,8 L-30,8 Z" fill="#c9a36a"/>
        <path d="M-28,-5 L16,-5 M-28,0 L16,0 M-28,5 L16,5" stroke="#a9834d" stroke-width=".8"/>
        <rect x="-14" y="-7" width="26" height="14" rx="3" fill="#fff" stroke="#8fa3b5"/>
        <rect x="4" y="-5" width="6" height="10" rx="1" fill="#5fa8d3"/>
        <rect x="-10" y="-3" width="9" height="6" rx="1" fill="#d62828"/>
        <path d="M-34,-11 L-34,11" stroke="#1a5fb4" stroke-width="3"/>
      </g>
      <text x="316" y="470" class="lbl">кеме</text>

      <g transform="translate(600,462)">
        <rect width="150" height="6" fill="#fff" rx="2"/><rect width="75" height="6" fill="#12304d" rx="2"/>
        <text x="0" y="22" class="lbl">0</text><text x="75" y="22" class="lbl">250</text><text x="150" y="22" class="lbl">500 м</text>
      </g>

      <g id="pins"></g>
    </g>
  </svg>

  <div class="ctl">
    <button id="zin" aria-label="Жақындату">+</button>
    <button id="zout" aria-label="Алыстату">−</button>
    <button id="zreset" aria-label="Бастапқы көрініс" style="font-size:16px">⟲</button>
  </div>

  <div id="sheet">
    <button id="close" aria-label="Жабу">×</button>
    
    <!-- 1. Үстіңгі қызғылт/түсті шапка (Тақырып) -->
    <div id="sHead">
      <h2><span class="num" id="sNum"></span><span id="sTitle"></span></h2>
      <div id="sSub"></div>
    </div>
    
    <!-- 2. Шапканың астындағы сурет -->
    <div id="sPhoto"><img id="sImg" alt=""></div>
    
    <!-- 3. Негізгі мәтіндер, тізімдер және QR код -->
    <div id="sBody">
      <p id="sDesc"></p>
      <h3 id="sListTitle">Не көресіз</h3>
      <ul id="sList"></ul>
      <div id="sQr"></div>
    </div>
  </div>
</div>

<nav id="nav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>


<!-- Суретті үлкейтіп көрсететін терезе (Lightbox) -->
<div id="imgModal" onclick="closeImageModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:10000; cursor:pointer;">
  <button id="imgClose" style="position:absolute; top:20px; right:30px; color:#fff; font-size:40px; background:none; border:none; cursor:pointer;">&times;</button>
  <img id="modalZoomImg" src="" alt="Үлкейтілген сурет" style="max-width:90%; max-height:90%; border-radius:8px; object-fit:contain;">
</div>

</body>
</html>
